<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800">
  <rect width="900" height="800" fill="#f2ede4"/>
  <line x1="0" y1="620" x2="900" y2="620" stroke="#999" stroke-width="3" stroke-dasharray="10,8"/>
  <text x="20" y="770" font-family="sans-serif" font-size="24" fill="#666">구역 1 / 3 — 방의 왼쪽 부분</text>

  <!-- ① 사료 그릇 -->
  <rect x="80" y="520" width="180" height="100" fill="none" stroke="#c0392b" stroke-width="4" stroke-dasharray="6,6"/>
  <text x="90" y="560" font-family="sans-serif" font-size="28" fill="#c0392b" font-weight="bold">① 사료 그릇</text>
  <text x="90" y="592" font-family="sans-serif" font-size="20" fill="#c0392b">바닥/구석</text>

  <!-- ② 잠자는 고양이 -->
  <rect x="420" y="420" width="260" height="200" fill="none" stroke="#2c3e50" stroke-width="5"/>
  <text x="430" y="470" font-family="sans-serif" font-size="30" fill="#2c3e50" font-weight="bold">② 잠자는 고양이</text>
  <text x="430" y="502" font-family="sans-serif" font-size="20" fill="#2c3e50">메인 캐릭터, 방석 위</text>

  <!-- overlap zone (right edge, connects to section 2) -->
  <rect x="800" y="0" width="100" height="800" fill="#000" opacity="0.06"/>
  <text x="805" y="40" font-family="sans-serif" font-size="18" fill="#333" writing-mode="tb" transform="rotate(90 805,40)">다음 구역과 이어짐 — 빈 벽/바닥만</text>
</svg>
