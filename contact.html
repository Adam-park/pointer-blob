<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Kim Yuna</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo-badge logo-badge--sm" aria-label="Kim Yuna"><span class="logo-letter">K</span><span class="logo-letter">Y</span></a>
      <nav class="main-nav">
        <a href="work.html">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="is-active" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-intro">
      <h1>Contact</h1>
      <p>채용 문의, 협업 제안, 프로젝트 견적 무엇이든 편하게 남겨주세요. 보통 1~2일 내로 답변드립니다.</p>
    </section>

    <section class="contact-grid">
      <div class="contact-info">
        <div class="info-row">
          <span class="info-label">Email</span>
          <a href="mailto:hello@example.com">hello@example.com</a>
        </div>
        <div class="info-row">
          <span class="info-label">Phone</span>
          <span>010-1234-5678</span>
        </div>
        <div class="info-row">
          <span class="info-label">Location</span>
          <span>서울, 대한민국 · 원격 협업 가능</span>
        </div>
        <div class="info-row">
          <span class="info-label">Social</span>
          <div class="social-links">
            <a href="#">Instagram</a>
            <a href="#">Behance</a>
            <a href="#">LinkedIn</a>
          </div>
        </div>
      </div>

      <div class="form-card">
        <form id="contactForm">
          <label class="form-field">
            <span>이름</span>
            <input type="text" name="name" required placeholder="홍길동">
          </label>
          <label class="form-field">
            <span>이메일</span>
            <input type="email" name="email" required placeholder="you@example.com">
          </label>
          <label class="form-field">
            <span>메시지</span>
            <textarea name="message" rows="5" required placeholder="프로젝트 내용이나 문의사항을 남겨주세요"></textarea>
          </label>
          <button type="submit" class="btn btn-primary">메시지 보내기</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Kim Yuna. All rights reserved.</p>
  </footer>

  <script src="contact.js"></script>
</body>
</html>
