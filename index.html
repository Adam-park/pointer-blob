<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>박무드 — Portfolio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="cursor-tooltip" class="cursor-tooltip" aria-hidden="true">
    <div class="tooltip-card">
      <span class="tooltip-date"></span>
      <span class="tooltip-desc"></span>
    </div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo-badge logo-badge--sm" aria-label="박무드"><span class="logo-letter">P</span></a>
      <nav class="main-nav">
        <a href="work.html">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="shelf-section">
      <div class="shelf-intro">
        <h2>Selected Work</h2>
      </div>
      <div class="shelf">
        <button class="shelf-arrow shelf-arrow--prev" id="shelfPrev" type="button" aria-label="이전 서류">‹</button>
        <div class="shelf-viewport">
          <div class="shelf-track" id="shelfTrack"></div>
        </div>
        <button class="shelf-arrow shelf-arrow--next" id="shelfNext" type="button" aria-label="다음 서류">›</button>
      </div>
    </section>

    <section class="cta-section">
      <a href="contact.html" class="cta-title">Contact<span class="cta-arrow">→</span></a>
      <div class="cta-meta">
        <div class="cta-info">
          <a href="mailto:hello@example.com">hello@example.com</a>
          <span>010-1234-5678</span>
          <span>서울, 대한민국</span>
        </div>
        <div class="cta-social">
          <a href="#">Instagram</a>
          <a href="#">Brunch</a>
          <a href="#">LinkedIn</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 박무드. All rights reserved.</p>
  </footer>

  <script src="sundial.js"></script>
  <script src="data.js"></script>
  <script src="tooltip.js"></script>
  <script src="sound.js"></script>
  <script src="home.js"></script>
</body>
</html>
